services:
  namenode:
    image: apache/hadoop:3.3.6
    container_name: twitter-hdfs-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file:
      - hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /data/namenode
    ports:
      - "8020:8020"
      - "9870:9870"
    volumes:
      - namenode_data:/data
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.3.6
    container_name: twitter-hdfs-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - hadoop.env
    depends_on:
      - namenode
    ports:
      - "9864:9864"
      - "9866:9866"
    volumes:
      - datanode_data:/data
    restart: unless-stopped

volumes:
  namenode_data:
  datanode_data:

